<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add item</title>
</head>
<body>

<h2>Add item</h2>

<form th:action="@{/orderitem/save}" th:object="${orderItem}" method="POST">

    <input type="hidden" th:field="*{orderNr}">

    <label>Name</label>
    <input type="text" th:field="*{name}">

    <label>Quantity</label>
    <input type="number" th:field="*{quantity}">

    <label>Price</label>
    <input type="number" step="0.01" th:field="*{price}">

    <label>Item number</label>
    <input type="number" th:field="*{itemNt}">

    <button type="submit">Save</button>

</form>

</body>
</html>
